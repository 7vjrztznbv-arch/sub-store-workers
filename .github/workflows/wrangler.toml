  - name: Generate wrangler.toml
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
     run: |
          cat > wrangler.toml <<'TOML'
         name = "sub-store-workers"
         main = "dist/worker.js"
         compatibility_date = "2024-09-23"
         compatibility_flags = ["nodejs_compat"]

   
         [triggers]
           crons = ["55 15 * * *"]

         [vars]
             SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
             SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/Yu9191/sub-store-workers@main/png/cloudflare.png"

         [pages]
            pages_build_output_dir = "pages-dist"
            bundle = true
           TOML
            sed -i "s/__KV_ID__/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml
            cat wrangler.toml

   - name: Deploy Pages
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy pages-dist \
            --project-name=my-sub-store \
            --bundle
