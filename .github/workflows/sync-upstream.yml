name: Sync Upstream Sub-Store

on:
  schedule:
    # 每天 UTC 16:00 = 北京 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制部署（即使无更新）'
        required: false
        default: 'false'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sub-store-workers
        uses: actions/checkout@v4
        with:
          path: sub-store-workers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Sub-Store (upstream)
        uses: actions/checkout@v4
        with:
          repository: sub-store-org/Sub-Store
          path: Sub-Store
          fetch-depth: 1

      - name: Get upstream version
        id: upstream
        working-directory: Sub-Store
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Upstream: $VERSION ($SHA)"

      - name: Read last synced version
        id: last
        working-directory: sub-store-workers
        run: |
          if [ -f .upstream-sha ]; then
            LAST=$(cat .upstream-sha)
          else
            LAST="none"
          fi
          echo "sha=$LAST" >> $GITHUB_OUTPUT
          echo "Last synced: $LAST"

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.last.outputs.sha }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed"
          fi

      - name: Setup Node
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sub-store-workers/package-lock.json

      - name: Enable corepack
        if: steps.check.outputs.needed == 'true'
        run: corepack enable

      - name: Configure upstream pnpm build scripts
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pnpm-workspace.yaml';
          const approved = ['core-js', 'esbuild', 'nodemon'];
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          text = text.replace(/^onlyBuiltDependencies:\n(?:[ \t].*(?:\n|$))*/m, '');
          if (!/^packages:/m.test(text)) {
            text = `packages:\n  - .\n${text.trim() ? `\n${text.trimStart()}` : ''}`;
          }
          if (!/^allowBuilds:/m.test(text)) {
            text = `${text.replace(/\s*$/, '')}\nallowBuilds:\n`;
          }
          for (const name of approved) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^(\\s*${escaped}\\s*:\\s*).*$`, 'm');
            if (pattern.test(text)) {
              text = text.replace(pattern, `$1true`);
            } else {
              text = text.replace(/^allowBuilds:\n/m, `allowBuilds:\n  ${name}: true\n`);
            }
          }
          fs.writeFileSync(file, text);
          NODE
          cat pnpm-workspace.yaml

      - name: Install upstream deps
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm install --no-frozen-lockfile

      - name: Run upstream tests
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm test

      - name: Install workers deps
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm ci

      - name: Build worker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm run build

      - name: Check worker bundle size
        if: steps.check.outputs.needed == 'true'
        id: size
        working-directory: sub-store-workers
        run: |
          BYTES=$(stat -c %s dist/worker.js)
          KB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1024}")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1024/1024}")
          GZIP_BYTES=$(gzip -c dist/worker.js | wc -c)
          GZIP_KB=$(awk "BEGIN {printf \"%.1f\", $GZIP_BYTES/1024}")
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "kb=$KB" >> $GITHUB_OUTPUT
          echo "mb=$MB" >> $GITHUB_OUTPUT
          echo "gzip_kb=$GZIP_KB" >> $GITHUB_OUTPUT
          echo "worker.js raw: ${KB} KB (${MB} MB), gzipped: ${GZIP_KB} KB"
          # Workers 付费上限 10 MiB（gzipped），免费 3 MiB（gzipped）
          HARD_LIMIT=$((10 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$HARD_LIMIT" ]; then
            echo "::error::Worker bundle gzipped size ${GZIP_KB} KB exceeds Cloudflare 10 MiB hard limit"
            exit 1
          fi
          FREE_LIMIT=$((3 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$FREE_LIMIT" ]; then
            echo "::warning::Worker bundle gzipped size ${GZIP_KB} KB exceeds Cloudflare free tier 3 MiB limit (paid plan required)"
          fi

      - name: Generate wrangler.toml
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          cat > wrangler.toml <<'TOML'
          name = "sub-store-workers"
          main = "dist/worker.js"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat"]

          [[kv_namespaces]]
          binding = "SUB_STORE_DATA"
          id = "__KV_ID__"

          [triggers]
          crons = ["55 15 * * *"]

          [vars]
          SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
          SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/Yu9191/sub-store-workers@main/png/cloudflare.png"
          TOML
          sed -i 's/^          //' wrangler.toml
          sed -i "s/__KV_ID__/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml
          echo "Generated wrangler.toml:"
          cat wrangler.toml

      - name: Deploy Workers
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Prepare Pages bundle
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          mkdir -p pages-dist
          cp dist/worker.js pages-dist/_worker.js
          # _worker.js 里有 `import h from "./quickjs.wasm"`，必须把 wasm 一起放进部署目录，
          # 否则 wrangler 打包时会 Could not resolve "./quickjs.wasm"
          cp dist/quickjs.wasm pages-dist/quickjs.wasm
          ls -la pages-dist

      - name: Deploy Pages
        if: steps.check.outputs.needed == 'true'
        id: pages
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 关键：不要加 --no-bundle。_worker.js 里有 `import x from "./quickjs.wasm"`，
          # 只有让 wrangler 打包，wasm 才会作为独立模块随 _worker.bundle 一起上传；
          # 加 --no-bundle 会直接触发 block-worker-js-imports 报错退出。
          set -o pipefail
          npx wrangler pages deploy pages-dist \
            --project-name "${{ secrets.PAGES_PROJECT_NAME }}" \
            --branch main \
            --commit-message "upstream ${{ steps.upstream.outputs.version }}" \
            --commit-dirty=true 2>&1 | tee /tmp/pages-deploy.log
          # 从部署输出里抓正式域名，给健康检查用（比手记 subdomain 可靠）
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' /tmp/pages-deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Pages URL: ${URL:-未识别}"

      - name: Update upstream-sha marker
        # 部署已成功，先把版本标记推进，避免下次白跑一遍完整流程
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha
          git commit -m "chore: sync upstream to ${{ steps.upstream.outputs.version }} [skip ci]" || exit 0
          git push

      - name: Health check
        if: steps.check.outputs.needed == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
        run: |
          # 探针定位：只记录体检结果 + 打印诊断，不作失败门禁。
          # 部署是否成功已经由 `wrangler deploy` / `wrangler pages deploy` 的退出码把关，
          # 这里再判死只会因为 CDN 传播延迟、国内网络不可达等无关因素把整条流水线拖红。
          PAGES_OK=0
          if [ -z "${PAGES_URL:-}" ]; then
            echo "::warning::未能从部署输出解析 pages.dev 域名，跳过 Pages 检查"
          else
            for i in 1 2 3 4; do
              sleep 10
              CODE=$(curl -s -o /tmp/pages-body.txt -m 25 -w "%{http_code}" "$PAGES_URL/") || CODE=000
              echo "Pages attempt $i: HTTP $CODE  ($PAGES_URL)"
              case "$CODE" in
                200|301|302|401|403|404) PAGES_OK=1; break ;;
              esac
            done
            if [ "$PAGES_OK" = "1" ]; then
              echo "Pages probe OK (HTTP $CODE)"
            else
              echo "::warning::Pages probe failed (last HTTP ${CODE:-none}); diagnostics below, deploy result unaffected"
              echo "--- 响应片段 ---"
              head -c 300 /tmp/pages-body.txt 2>/dev/null | tr -d '\r' || true
              echo ""
              echo "--- 响应头 ---"
              curl -sI -m 25 "$PAGES_URL/" 2>&1 | head -15 || true
            fi
          fi

          # 附加检查：workers.dev（Cron 依赖它），失败同样只告警
          if [ -z "${WORKERS_SUBDOMAIN:-}" ]; then
            echo "::warning::WORKERS_SUBDOMAIN secret 未配置，跳过 workers.dev 检查"
          else
            WURL="https://sub-store-workers.${WORKERS_SUBDOMAIN}.workers.dev"
            WCODE=000
            for i in 1 2 3; do
              sleep 5
              WCODE=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$WURL/") || WCODE=000
              echo "Workers attempt $i: HTTP $WCODE  ($WURL)"
              case "$WCODE" in
                200|301|302|401|403|404|500) break ;;
              esac
            done
            case "$WCODE" in
              200|301|302|401|403|404) echo "Workers 正常" ;;
              500) echo "::warning::$WURL returns 500 - likely missing KV binding or runtime error (Pages entry unaffected)" ;;
              *) echo "::warning::$WURL unreachable (HTTP $WCODE) - workers.dev blocked or disabled; check it yourself if you rely on Cron" ;;
            esac
          fi

      - name: Write job summary
        if: always() && steps.check.outputs.needed == 'true'
        run: |
          {
            echo "## Sub-Store Workers 同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 上游版本 | \`${{ steps.upstream.outputs.version }}\` |"
            echo "| 上游 SHA | \`${{ steps.upstream.outputs.sha }}\` |"
            echo "| 上次同步 SHA | \`${{ steps.last.outputs.sha }}\` |"
            echo "| Worker 原始大小 | ${{ steps.size.outputs.kb }} KB (${{ steps.size.outputs.mb }} MB) |"
            echo "| Worker gzip 大小 | ${{ steps.size.outputs.gzip_kb }} KB |"
            echo "| Pages 域名 | ${{ steps.pages.outputs.url }} |"
            echo ""
            if [ "${{ steps.last.outputs.sha }}" != "none" ] && [ "${{ steps.last.outputs.sha }}" != "${{ steps.upstream.outputs.sha }}" ]; then
              echo "**上游 diff**: https://github.com/sub-store-org/Sub-Store/compare/${{ steps.last.outputs.sha }}...${{ steps.upstream.outputs.sha }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bark notify success
        if: steps.check.outputs.needed == 'true' && success()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          # 注意：步骤自己的 env 在 if 求值时不可见，所以「有没有配 BARK_KEY」必须在这里判
          if [ -z "${BARK_KEY:-}" ]; then
            echo "BARK_KEY 未配置，跳过通知"
            exit 0
          fi
          curl -sf "https://api.day.app/${BARK_KEY}/Sub-Store%20${UPSTREAM_VERSION}/Workers%20%2B%20Pages%20deployed" || echo "Bark 推送失败（不影响部署结果）"

      - name: Bark notify failure
        if: failure()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${BARK_KEY:-}" ]; then
            echo "BARK_KEY 未配置，跳过通知"
            exit 0
          fi
          VER="${UPSTREAM_VERSION:-unknown}"
          TITLE="Sub-Store%20Sync%20Failed%20${VER}"
          BODY=$(printf '%s' "${RUN_URL}" | sed 's/:/%3A/g; s|/|%2F|g')
          curl -sf "https://api.day.app/${BARK_KEY}/${TITLE}/${BODY}" || echo "Bark 推送失败（不影响部署结果）"
